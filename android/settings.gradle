pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath != null && !sdkPath.isEmpty()) return sdkPath

        if (System.getenv("FLUTTER_ROOT") != null) return System.getenv("FLUTTER_ROOT")
        if (System.getenv("FLUTTER_HOME") != null) return System.getenv("FLUTTER_HOME")

        try {
            def proc = ["which", "flutter"].execute()
            proc.waitFor()
            def flutterBin = proc.text.trim()
            if (flutterBin) {
                def binFile = new File(flutterBin)
                return binFile.parentFile.parentFile.absolutePath
            }
        } catch (Exception e) {
            // Ignore execution failure
        }

        throw new GradleException("Flutter SDK path not found.")
    }()

    includeBuild("/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
