pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(settingsDir, "local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { stream ->
                properties.load(stream)
            }
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath == null || sdkPath.toString().trim().isEmpty()) {
            sdkPath = System.getenv("FLUTTER_ROOT")
        }
        if (sdkPath == null || sdkPath.toString().trim().isEmpty()) {
            sdkPath = System.getenv("FLUTTER_HOME")
        }
        return sdkPath
    }()

    includeBuild(flutterSdkPath + "/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
