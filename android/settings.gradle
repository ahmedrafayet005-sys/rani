pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(settingsDir, "local.properties")
        println "[GRADLE DEBUG] settingsDir = " + settingsDir.absolutePath
        println "[GRADLE DEBUG] localPropertiesFile exists = " + localPropertiesFile.exists()
        if (localPropertiesFile.exists()) {
            println "[GRADLE DEBUG] localPropertiesFile text = 
" + localPropertiesFile.text
            localPropertiesFile.withInputStream { stream -> properties.load(stream) }
        }
        println "[GRADLE DEBUG] properties keys = " + properties.keySet()
        def sdkPath = properties.getProperty("flutter.sdk")
        println "[GRADLE DEBUG] sdkPath from prop = '" + sdkPath + "'"
        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            sdkPath = System.getenv("FLUTTER_ROOT")
            println "[GRADLE DEBUG] sdkPath from FLUTTER_ROOT = '" + sdkPath + "'"
        }
        return sdkPath
    }()
    println "[GRADLE DEBUG] final flutterSdkPath = '" + flutterSdkPath + "'"

    includeBuild(flutterSdkPath + "/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
